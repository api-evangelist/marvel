naftiko: 1.0.0-alpha2
info:
  label: Marvel Comics API — Characters
  description: 'Marvel Comics API — Characters. 3 operations. Lead operation: List characters. Self-contained Naftiko capability
    covering one Marvel business surface.'
  tags:
  - Marvel
  - Characters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARVEL_API_KEY: MARVEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: marvel-characters
    baseUri: https://gateway.marvel.com/v1/public
    description: Marvel Comics API — Characters business capability. Self-contained, no shared references.
    resources:
    - name: characters
      path: /characters
      operations:
      - name: listcharacters
        method: GET
        description: List characters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: characters-characterId
      path: /characters/{characterId}
      operations:
      - name: getcharacter
        method: GET
        description: Get character by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: characters-characterId-comics
      path: /characters/{characterId}/comics
      operations:
      - name: listcharactercomics
        method: GET
        description: List comics for a character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: apikey
      value: '{{env.MARVEL_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: marvel-characters-rest
    port: 8080
    description: REST adapter for Marvel Comics API — Characters. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/characters
      name: characters
      description: REST surface for characters.
      operations:
      - method: GET
        name: listcharacters
        description: List characters
        call: marvel-characters.listcharacters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/characters/{characterid}
      name: characters-characterid
      description: REST surface for characters-characterId.
      operations:
      - method: GET
        name: getcharacter
        description: Get character by ID
        call: marvel-characters.getcharacter
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/characters/{characterid}/comics
      name: characters-characterid-comics
      description: REST surface for characters-characterId-comics.
      operations:
      - method: GET
        name: listcharactercomics
        description: List comics for a character
        call: marvel-characters.listcharactercomics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: marvel-characters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Marvel Comics API — Characters. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-characters
      description: List characters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: marvel-characters.listcharacters
      outputParameters:
      - type: object
        mapping: $.
    - name: get-character-id
      description: Get character by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: marvel-characters.getcharacter
      outputParameters:
      - type: object
        mapping: $.
    - name: list-comics-character
      description: List comics for a character
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: marvel-characters.listcharactercomics
      outputParameters:
      - type: object
        mapping: $.
